[project]
name = "seadelivery-bot"
version = "0.1.0"
description = "Telegram-бот ролевого ивента «Морская доставка» (торговая экспедиция между островами)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13.1",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "Pillow>=10.4.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
seadelivery-bot = "seadelivery_bot.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seadelivery_bot"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]
# RUF001/002/003: в коде много русских (кириллических) строк интерфейса, где
# буквы вроде `с`, `е`, `о` — намеренно кириллица, а не опечатки латиницей.
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["aiosqlite.*", "asyncpg.*", "PIL.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
